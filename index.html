<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Job Application Dashboard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="border-bottom bg-white sticky-top">
      <div class="container py-3">
        <h1 class="h3 mb-0">Job Application Dashboard</h1>
      </div>
    </header>

    <main class="container py-4">
      <section aria-label="Summary statistics" class="mb-4">
        <div class="row g-3" id="summaryCards"></div>
      </section>

      <section aria-label="Filters" class="card shadow-sm mb-4">
        <div class="card-body">
          <div class="row g-3 align-items-end">
            <div class="col-md-3">
              <label class="form-label" for="searchInput">Search</label>
              <input id="searchInput" class="form-control" type="search" placeholder="Company, position, tags" />
            </div>
            <div class="col-md-2">
              <label class="form-label" for="statusFilter">Status</label>
              <select id="statusFilter" class="form-select"></select>
            </div>
            <div class="col-md-2">
              <label class="form-label" for="priorityFilter">Priority</label>
              <select id="priorityFilter" class="form-select"></select>
            </div>
            <div class="col-md-2">
              <label class="form-label" for="availabilityFilter">Availability</label>
              <select id="availabilityFilter" class="form-select"></select>
            </div>
            <div class="col-md-3">
              <label class="form-label" for="companyFilter">Company</label>
              <select id="companyFilter" class="form-select"></select>
            </div>
            <div class="col-md-3">
              <label class="form-label" for="locationFilter">Location</label>
              <select id="locationFilter" class="form-select"></select>
            </div>
            <div class="col-md-3">
              <label class="form-label" for="tagFilter">Tag</label>
              <select id="tagFilter" class="form-select"></select>
            </div>
            <div class="col-md-3">
              <label class="form-label" for="sortBy">Sort by</label>
              <select id="sortBy" class="form-select">
                <option value="lastUpdate_desc">Last update (newest)</option>
                <option value="lastUpdate_asc">Last update (oldest)</option>
                <option value="priority_asc">Priority (high to low)</option>
                <option value="priority_desc">Priority (low to high)</option>
                <option value="company_asc">Company (A-Z)</option>
                <option value="company_desc">Company (Z-A)</option>
              </select>
            </div>
            <div class="col-md-3 d-grid">
              <button id="resetFilters" class="btn btn-outline-secondary" type="button">Reset Filters</button>
            </div>
          </div>
        </div>
      </section>

      <section aria-label="Jobs table" class="card shadow-sm mb-4">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0" id="jobsTable">
            <thead class="table-light">
              <tr>
                <th scope="col">Priority</th>
                <th scope="col">Company</th>
                <th scope="col">Position</th>
                <th scope="col">Location</th>
                <th scope="col">Availability</th>
                <th scope="col">Application Status</th>
                <th scope="col">Applied Date</th>
                <th scope="col">Last Update</th>
                <th scope="col">Documents</th>
              </tr>
            </thead>
            <tbody id="jobsTableBody"></tbody>
          </table>
        </div>
      </section>

      <section aria-label="Job opportunities map" class="card shadow-sm">
        <div class="card-body">
          <h2 class="h5">Map</h2>
          <div id="jobsMap" role="region" aria-label="Map of job opportunities"></div>
        </div>
      </section>
    </main>

    <div class="modal fade" id="jobDetailModal" tabindex="-1" aria-labelledby="jobDetailTitle" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title fs-5" id="jobDetailTitle">Job Details</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body" id="jobDetailBody"></div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
